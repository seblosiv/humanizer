# Discourse markers and their alternatives for variation
discourse_markers:
  however:
    - "Nevertheless"
    - "Nonetheless"
    - "Yet"
    - "Still"

  therefore:
    - "Thus"
    - "Hence"
    - "Consequently"
    - "As a result"

  furthermore:
    - "Moreover"
    - "Additionally"
    - "In addition"
    - "Also"

  for example:
    - "For instance"
    - "Such as"
    - "Like"

  in conclusion:
    - "To conclude"
    - "In summary"
    - "To sum up"
    - "Finally"

  first:
    - "Firstly"
    - "To begin"
    - "Initially"

  second:
    - "Secondly"
    - "Next"
    - "Then"

  finally:
    - "Lastly"
    - "In the end"
    - "Ultimately"
